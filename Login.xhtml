<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Strict//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xml:lang="id" lang="id">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8" />
    <title>Halaman Login</title>
</head>
<body>
    <h2>Masuk ke Akun Anda</h2>
    <p>Silakan masukkan username dan kata sandi Anda.</p>

    <form action="" method="post">
        <table>
            <tr>
                <td><label for="username"><strong>Username / Email:</strong></label></td>
                <td><input type="text" id="username" name="username" size="30" /></td>
            </tr>
            <tr>
                <td><label for="password"><strong>Kata Sandi:</strong></label></td>
                <td><input type="password" id="password" name="password" size="30" /></td>
            </tr>
            <tr>
                <td></td>
                <td>
                    <input type="checkbox" id="remember" name="remember" value="1" />
                    <label for="remember">Ingat Saya</label>
                </td>
            </tr>
            <tr>
                <td></td>
                <td>
                    <input type="submit" id="submit" name="submit" value="Masuk" />
                    <input type="reset" id="reset" name="reset" value="Batal" />
                </td>
            </tr>
            <tr>
                <td></td>
                <td>
                    <p><a href="#">Lupa Kata Sandi?</a></p>
                    <p>Belum punya akun? <a href="#">Daftar di sini</a></p>
                </td>
            </tr>
        </table>
    </form>
</body>
</html>
