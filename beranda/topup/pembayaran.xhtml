<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="id" xml:lang="id">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Pembayaran – Topupin</title>
<link rel="stylesheet" href="assets/css/style.css"/>
</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>
<header class="top"><div class="wrap bar0"><a class="logo" href="index.xhtml"><span class="logo-box">G</span>TOPUPIN</a></div></header>
<main class="wrap narrow">
  <div class="card pad">
    <h1 class="h2">Halaman pembayaran</h1>
    <p>Ini halaman sementara. Ganti seluruh isinya dengan halaman pembayaran buatan temanmu.</p>
    <!--
      DATA DARI order.xhtml (dua cara, pilih salah satu):
      1) Query string: ?game=mlbb&pack=1&item=172+Diamond&price=44000&acc_uid=123&acc_zone=456
         (kunci acc_* sesuai field game: mlbb=uid,zone | valorant=riot | steam=steam | roblox=user | warframe=ign)
      2) sessionStorage 'gv_checkout' (JSON): {game, gameName, pack, item, price, account:{...}}
      Catatan: kalau pakai backend, hitung ulang harga dari game + pack di server. Jangan percaya parameter price.- catatan by gustav pada semua member
    -->
    <dl id="d" class="dl"></dl>
    <a class="btn" href="index.xhtml">Kembali ke daftar game</a>
  </div>
</main>
<script>
//<![CDATA[
(function () {
  var q = new URLSearchParams(location.search), d = document.getElementById('d');
  q.forEach(function (v, k) {
    var dt = document.createElement('dt'), dd = document.createElement('dd');
    dt.textContent = k; dd.textContent = v; d.appendChild(dt); d.appendChild(dd);
  });
  if (!d.children.length) d.textContent = 'Belum ada data pesanan.';
})();
//]]>
</script>
</body>
</html>
