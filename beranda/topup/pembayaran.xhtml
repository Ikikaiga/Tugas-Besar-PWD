<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" lang="id" xml:lang="id">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Pembayaran – Topupin</title>
<link rel="stylesheet" href="assets/css/style.css"/>
<link rel="stylesheet" href="assets/css/pembayaran.css"/>
</head>
<body>
<div class="bg" aria-hidden="true"><i></i><i></i><i></i></div>
<header class="top"><div class="wrap bar0">
  <a class="logo" href="index.xhtml"><span class="logo-box">G</span>TOPUPIN</a>
  <div id="userNav" class="user-nav">
    <a class="btn gold sm" href="../../login/Login.xhtml">Masuk</a>
  </div>
</div></header>
<main class="wrap narrow">
  <div class="card pad">
    <h1 class="h2">Halaman pembayaran</h1>
    <p>Silahkan periksa pesanan dan pilih metode pembayaran.</p>

    <h2>Detail Pesanan</h2>
    <dl id="detailPesanan" class="dl"></dl>
    
    <h2>Total yang Harus Dibayar</h2>
    <h2 id="totalHarga">Rp 0</h2>

    <h2>Metode Pembayaran</h2>

    <div class="packs pembayaran">
      <label class="opt">
        <input type="radio" id="transfer" name="metode" value="transfer"/>
        <span>
          <b>Transfer Bank</b>
          <span class="logoBayar">
            <img src="assets/img/BCA.jpg" alt="BCA"/>
            <img src="assets/img/BRI.jpg" alt="BRI"/>
            <img src="assets/img/mandiri.jpg" alt="Mandiri"/>
          </span>
        </span>
      </label>

      <label class="opt">
        <input type="radio" id="qris" name="metode" value="qris"/>
        <span>
          <b>QRIS</b>
          <span class="logoBayar">
            <img src="assets/img/QRIS.jpg" alt="QRIS"/>
          </span>
        </span>
      </label>
    </div>

    <p id="pesanError" class="err"></p>
    <button class="btn gold" id="btnLanjut" type="button" onclick="lanjutBayar()">Lanjut Bayar</button>
    <button class="btn" id="btnBatal" type="button" onclick="batalBayar()">Batal Bayar</button>

    <div id="areaQRIS" hidden="hidden">
      <h2>Scan QR Code</h2>
      <p>Silahkan scan kode QR berikut.</p>

      <div id="kodeQR">
        <img src="assets/img/QR_Bayar.png" alt="QR CODE" />
      </div>

      <button class="btn gold" id="btnKonfirmasiQRIS" type="button" onclick="konfirmasiQRIS()">Konfirmasi Pembayaran</button>
    </div>

    <div id="areaBerhasil" hidden="hidden">
      <h2>Pembayaran Berhasil</h2>
      <p id="metodeBerhasil"></p>

      <a class="btn gold" href="index.xhtml">Kembali ke daftar game</a>
    </div>

    <form action="simpanResi.php" method="POST">

    <input type="text"
           name="nama"
           placeholder="Nama pelanggan"
           required="required"/>

    <input type="text"
           name="game"
           placeholder="Nama game"
           required="required"/>

    <input type="text"
           name="item"
           placeholder="Paket yang dibeli"
           required="required"/>

    <input type="text"
           name="user_game"
           placeholder="User ID game"
           required="required"/>

    <input type="number"
           name="amount"
           placeholder="Total pembayaran"
           required="required"/>

    <select name="payment_method" required="required">
        <option value="QRIS">QRIS</option>
        <option value="TRANSFER_BANK">
            Transfer Bank
        </option>
    </select>

    <select name="bank" required="required">
        <option value="BCA"></option>
        <option value="BNI"></option>
        <option value="MANDIRI"></option>
    </select>

    <input type="text"
           name="va_number"
           placeholder="Nomor Virtual Account"
           required="required"/>

    <button type="submit">
        Bayar dan Buat Resi
    </button>

</form>

  </div>
</main>
<script src="assets/js/games.js"></script>
<script src="assets/js/auth.js?v=2"></script>
<script src="assets/js/pembayaran.js"></script>
</body>
</html>
